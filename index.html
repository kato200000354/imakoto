<!doctype html>
<html lang="ja">
<head>
<title>いまコト</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="今、話題の言葉を、意味・流行の理由・使い方の例つきでやさしく解説するアプリ。">
<meta name="theme-color" content="#3565F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="いまコト">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#E9EFFD; --ground2:#F4EEFF;
  --surface:#FFFFFF; --surface2:#F3F6FE; --line:#E1E7F5;
  --ink:#1B2240; --muted:#67708C; --faint:#98A0B8;
  --primary:#3565F2; --violet:#7B5CF2; --onprimary:#FFFFFF;
  --hot:#F0457E; --hot-bg:#FFE9F0; --good:#1FAE78; --good-bg:#E3F7EE;
  --trend-bg:#E8F0FF; --rise-bg:#FFEEF1;
  --g-sns:#3B7CF6; --g-game:#1FAE78; --g-music:#E04FA8; --g-gourmet:#F08A1C; --g-news:#0C9FC2; --g-ent:#9A57EE; --g-other:#6B7A99;
  --shadow:0 18px 50px -20px rgba(40,60,140,.35);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1428; --ground2:#18132C;
    --surface:#1A2038; --surface2:#222A47; --line:#2E3758;
    --ink:#EEF1FB; --muted:#A5AECB; --faint:#7A84A4;
    --primary:#6F92FF; --violet:#A08BFF; --onprimary:#0E1430;
    --hot:#FF6B9A; --hot-bg:#3A1F2E; --good:#3FD39A; --good-bg:#16372C;
    --trend-bg:#1F2B4F; --rise-bg:#3A2130;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1428; --ground2:#18132C;
  --surface:#1A2038; --surface2:#222A47; --line:#2E3758;
  --ink:#EEF1FB; --muted:#A5AECB; --faint:#7A84A4;
  --primary:#6F92FF; --violet:#A08BFF; --onprimary:#0E1430;
  --hot:#FF6B9A; --hot-bg:#3A1F2E; --good:#3FD39A; --good-bg:#16372C;
  --trend-bg:#1F2B4F; --rise-bg:#3A2130;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(135deg,var(--ground),var(--ground2));font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
svg{display:block}

.stage{min-height:100%;display:flex;justify-content:center;align-items:center;gap:56px;padding-block:32px;padding-inline:24px}
.intro{max-width:340px;display:flex;flex-direction:column;gap:22px}
.logo-big{font-size:64px;font-weight:800;line-height:1;letter-spacing:.02em;background:linear-gradient(100deg,var(--primary),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.intro h2{margin:0;font-size:24px;line-height:1.5;text-wrap:balance}
.intro p{margin:0;color:var(--muted);line-height:1.9}
.points{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.points li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px}
.points .pi{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.points b{display:block;font-size:13px}
.points span{font-size:12px;color:var(--muted)}

.device{position:relative;width:390px;height:min(820px,calc(100vh - 64px));background:var(--surface);border-radius:44px;border:8px solid #1B2240;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
@media (max-width:900px){ .intro{display:none} .stage{padding:0} }
@media (max-width:520px){
  .device{width:100%;border:0;border-radius:0;box-shadow:none;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .stage{display:block}
}

/* bottom nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--faint);padding:4px 0;border-radius:12px}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700}
.nav svg{width:24px;height:24px}

/* common */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.topbar h1{margin:0;font-size:17px;font-weight:800;flex:1;text-align:center}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:var(--primary)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px}
.date{margin:-8px 0 0;font-weight:700;font-size:13px}
.date small{font-weight:400;color:var(--muted);margin-left:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.sec-title{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sec-title small{font-weight:400;font-size:11px;color:var(--muted)}
.panel{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-head .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.panel-head .badge svg{width:18px;height:18px}
.panel-head b{display:block;font-size:14px}
.panel-head span{display:block;font-size:11px;color:var(--muted)}
.trend{background:var(--trend-bg)}
.rise{background:var(--rise-bg)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 4px;border-radius:10px;font-weight:700}
.rank button:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.rank .n{width:18px;text-align:center;color:var(--primary);font-variant-numeric:tabular-nums}
.rank .one{flex:1;min-width:0;font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:999px;font-weight:700;padding:0 20px}
.btn-primary{background:linear-gradient(100deg,var(--primary),var(--violet));color:#fff}
.btn-ghost{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}
.btn-sm{height:34px;font-size:12px;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.genres{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.genre{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:12px}
.genre .gi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.genre .gi svg{width:22px;height:22px}
.genre[aria-pressed="true"] .gi{outline:3px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
.genre[aria-pressed="true"]{color:var(--ink)}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;line-height:1.7;white-space:nowrap}
.pill-soft{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.row:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .ttl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:15px}
.row .desc{font-size:12px;color:var(--muted)}
.row .meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--faint)}
.row .chev{color:var(--faint);align-self:center}
.row .chev svg{width:18px;height:18px}
.heat{display:inline-flex;gap:2px;align-items:center}
.heat i{width:6px;height:10px;border-radius:2px;background:var(--line)}
.heat i.on{background:var(--hot)}
.flame{color:var(--hot);width:16px;height:16px}
.fav{color:var(--hot);align-self:center;padding:6px;border-radius:50%}
.fav svg{width:22px;height:22px}

/* avatar mascot */
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.av svg{width:70%;height:70%}
.av-lg{width:72px;height:72px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:999px;padding:4px}
.seg button{height:34px;border-radius:999px;font-weight:700;color:var(--muted);font-size:13px}
.seg button[aria-selected="true"]{background:linear-gradient(100deg,var(--primary),var(--violet));color:#fff}

.empty{text-align:center;color:var(--muted);padding:32px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* detail */
.overlay{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;z-index:5;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.hero{display:flex;align-items:center;gap:14px}
.hero h2{margin:0;font-size:24px;font-weight:800;line-height:1.2}
.hero .yomi{font-size:12px;color:var(--muted)}
.hero .pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.oneline{background:var(--trend-bg);border-radius:16px;padding:12px 16px}
.oneline small{display:block;color:var(--primary);font-weight:700;font-size:11px}
.oneline p{margin:4px 0 0;font-weight:700;font-size:15px}
.block h3{margin:0 0 6px;font-size:15px;color:var(--primary)}
.block p{margin:0;line-height:1.85}
.ex{display:flex;flex-direction:column;gap:8px}
.ex div{background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:13px}
.ex span{display:block;color:var(--muted);font-size:12px}
.foot{border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot a{color:var(--primary)}
.ai-note{background:var(--hot-bg);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:11px}

/* quiz */
.quizhead{background:linear-gradient(110deg,var(--primary),var(--violet));color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quizhead b{font-size:17px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;font-weight:800;font-size:16px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface);font-weight:500;font-size:13px}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px}
.choice.correct{border-color:var(--good);background:var(--good-bg)}
.choice.correct .k{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--hot);background:var(--hot-bg)}
.choice.wrong .k{background:var(--hot);border-color:var(--hot);color:#fff}
.choice:disabled{cursor:default}
.feedback{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.score{font-size:48px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700}
.setrow label{display:flex;align-items:center;gap:10px}
.setrow svg{width:20px;height:20px;color:var(--primary)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
select.sel{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px}
.gchecks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcheck{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:12px;cursor:pointer}
.gcheck:has(input:checked){border-color:var(--primary);background:var(--trend-bg)}
.gcheck input{accent-color:var(--primary);width:18px;height:18px;margin:0 0 0 auto}
.gcheck .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.gcheck .dot svg{width:13px;height:13px}
.note{font-size:11px;color:var(--muted);margin:0}

/* 30-second card */
.cardwrap{position:absolute;inset:0;z-index:8;background:linear-gradient(160deg,var(--primary),var(--violet));display:flex;flex-direction:column;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:14px;color:#fff;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cardtop{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.cardtop .timer{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums}
.cardprog{height:4px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.cardprog i{display:block;height:100%;background:#fff;transition:width 1s linear}
.flash{flex:1;background:var(--surface);color:var(--ink);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;overflow:auto}
.flash h2{margin:0;font-size:28px;font-weight:800}
.flash .yomi{color:var(--muted);font-size:12px;margin-top:-8px}
.flash .def{color:var(--primary);font-weight:700;font-size:15px;margin:0}
.flash .why{background:var(--trend-bg);border-radius:18px;padding:12px 14px;text-align:left;width:100%}
.flash .why b{display:block;margin-bottom:4px}
.flash .why p{margin:0;font-size:13px;color:var(--ink)}
.cardbtns{display:flex;align-items:center;gap:12px}
.cardbtns .btn{flex:1;background:#fff;color:var(--primary)}
.cardbtns .skip{color:#fff;font-weight:700;padding:0 12px;height:44px}

.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:99px;font-size:12px;font-weight:700;z-index:20;white-space:nowrap}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="intro" aria-label="いまコトについて">
    <p class="logo-big">いまコト</p>
    <h2>今、話題の言葉を<br>わかりやすく。</h2>
    <p>SNS・ネット・メディアで話題の「今の言葉」を、すぐに・やさしく・楽しく解説します。</p>
    <ul class="points" id="points"></ul>
  </aside>

  <div class="device" id="device">
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="メインメニュー"></nav>
  </div>
</div>

<script>
/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.5v9h5.5v-6h3v6H19v-9h2.5z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>',
  bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  bookmarkF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',

function newQuiz(){
  const pool=[...WORDS].sort(()=>Math.random()-.5).slice(0,5);
  return {i:0,score:0,picked:null,qs:pool.map(w=>{
    const wrong=WORDS.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.one);
    const opts=[...wrong,w.one].sort(()=>Math.random()-.5);
    return {w,opts,ans:opts.indexOf(w.one)};
  })};
}
function learn(){
  if(!st.quiz) st.quiz=newQuiz();

let cardTimer=null;
function openCards(list){
  closeCards();
  const wrap=document.createElement('div'); wrap.className='cardwrap'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-label','30秒でわかるカード');
  $('#device').append(wrap);
  let i=0, left=30;
  const draw=()=>{
    const w=list[i];
    wrap.innerHTML=`<div class="cardtop"><span>${i+1} / ${list.length}</span><span class="timer">${I.clock.replace('<svg','<svg width="16" height="16"')}<span id="sec">${left}</span>秒</span></div>
    <div class="cardprog"><i id="cprog" style="width:${(30-left)/30*100}%"></i></div>
    <div class="flash">${av(w,true)}<h2>${esc(w.w)}</h2><div class="yomi">（${esc(w.r)}）</div><p class="def">${esc(w.one)}</p>
      <div class="why"><b>なぜ流行ってるの？</b><p>${esc(w.why)}</p></div>
      ${w.ex?.[0]?`<div class="why" style="background:var(--surface2)"><b>使い方</b><p>${esc(w.ex[0][0])} ${esc(w.ex[0][1]||'')}</p></div>`:''}</div>
    <div class="cardbtns"><button class="btn" data-cnext>${i+1<list.length?'次へ':'おわり'}</button><button class="skip" data-cclose>閉じる</button></div>`;
    addHist(w.id);
  };
  const tick=()=>{ left--; if(left<=0){ next(); return; } const s=wrap.querySelector('#sec'); if(s) s.textContent=left; const p=wrap.querySelector('#cprog'); if(p) p.style.width=((30-left)/30*100)+'%'; };
  const next=()=>{ if(i+1<list.length){ i++; left=30; draw(); } else closeCards(); };
  wrap.addEventListener('click',e=>{ if(e.target.closest('[data-cnext]')) next(); if(e.target.closest('[data-cclose]')) closeCards(); });
  draw(); cardTimer=setInterval(tick,1000);
}
function closeCards(){ clearInterval(cardTimer); cardTimer=null; document.querySelector('.cardwrap')?.remove(); if(st.tab==='saved') render(); }

/* ---------- AI lookup ---------- */
// アプリ版ではAI解説はまだ使えない（Claude APIをつなぐときに true にする）
const AI_ENABLED = false;
let samplePromise = Promise.resolve(null);
async function askAI(q){
  const scr=$('#screen');
  const box=document.createElement('div'); box.className='overlay';
  box.innerHTML=`<div class="screen"><div class="topbar"><button class="iconbtn" data-close aria-label="戻る">${I.back}</button><h1>AI解説</h1><span style="width:36px"></span></div>
    <div class="empty"><div class="spinner" aria-hidden="true"></div><b>「${esc(q)}」を調べています…</b><span>AIが考えています。10〜30秒ほどかかることがあります。</span></div></div>`;
  $('#device').append(box);
  const fail = msg => { box.querySelector('.empty').innerHTML=`${mascot('var(--faint)').replace('<svg','<svg width="56" height="56"')}<b>${msg}</b><button class="btn btn-ghost btn-sm" data-close>戻る</button>`; };
  const sample = await samplePromise;
  if(!sample){ fail('このページではAI解説が使えません（claude.ai上で開くと使えます）'); return; }
  const prompt = `あなたは日本の流行語・ネットスラング・若者言葉をやさしく解説する編集者です。
次の言葉を、中高生にもわかる日本語で解説してください。
言葉：「${q.slice(0,60)}」

ルール：
- 意味を知らない、または確信がない場合は推測で作らず {"known": false} だけを返す
- 実在の人物を傷つける内容や、差別的な使い方の例文は書かない
- JSONだけを返す。形式：
{"known": true, "word": "見出し語", "reading": "ひらがなの読み", "genre": "sns|game|music|gourmet|news|ent|other のどれか", "tags": ["短いタグ", "最大2つ"], "one": "ひとことで言うと（40字以内）", "why": "なぜ話題になったか・由来（120字以内）", "examples": [["「例文」", "（=言い換え）"], ["「例文」", "（=言い換え）"]], "related": ["関連する言葉", "最大3つ"]}`;
  try{
    const r = await sample.json(prompt);
    if(!r || r.known===false || !r.one){ fail(`「${q}」はAIもよく知らない言葉でした`); return; }
    const id='ai-'+Array.from(q).map(c=>c.codePointAt(0).toString(36)).join('');
    const w={id,aiMade:true,made:Date.now(),w:String(r.word||q),r:String(r.reading||''),g:GENRES[r.genre]?r.genre:'other',
      tags:(Array.isArray(r.tags)?r.tags:[]).slice(0,2).map(String),heat:1,one:String(r.one),why:String(r.why||''),
      ex:(Array.isArray(r.examples)?r.examples:[]).slice(0,3).map(e=>Array.isArray(e)?[String(e[0]||''),String(e[1]||'')]:[String(e),'']),
      rel:(Array.isArray(r.related)?r.related:[]).slice(0,3).map(String)};
    st.ai[id]=w; store.set('ai',st.ai); addHist(id);
    box.remove(); openDetail(id,false);
  }catch(e){
    const m={not_granted:'AIの利用が許可されませんでした',sampling_disabled:'このアカウントではAIが使えません',rate_limited:'混み合っています。少し待ってからもう一度お試しください',invalid_json:'うまく解説を作れませんでした。もう一度お試しください',refused:'この言葉は解説できませんでした'};
    fail(m[e?.code]||'通信に失敗しました。もう一度お試しください');
  }
}

/* ---------- render & events ---------- */
const TABS=[['home','ホーム',I.home],['timeline','タイムライン',I.clock],['saved','保存',I.bookmark],['learn','学習',I.bulb],['settings','設定',I.gear]];
function render(keepScroll){
  const scr=$('#screen'); const y=scr.scrollTop;
  scr.innerHTML = ({home,timeline,saved,learn,settings})[st.tab]();
  $('#nav').innerHTML = TABS.map(([k,l,ic])=>`<button data-tab="${k}" ${st.tab===k?'aria-current="page"':''}>${k==='saved'&&st.tab==='saved'?I.bookmarkF:ic}${l}</button>`).join('');
  if(keepScroll) scr.scrollTop=y;
  const q=$('#q');
  if(q){
    // 日本語入力（IME変換中）は再描画しない
    const update=()=>{ st.q=q.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch{} };
    q.addEventListener('input',ev=>{ if(ev.isComposing) return; update(); });
    q.addEventListener('compositionend',update);
  }
}
function openDetail(id,push=true){
  const w=get(id); if(!w) return;
  document.querySelector('.overlay')?.remove();
  addHist(id);
  const tmp=document.createElement('div'); tmp.innerHTML=detail(w);
  $('#device').append(tmp.firstElementChild);
  st.detail=id;
}
function closeDetail(){ document.querySelectorAll('.overlay').forEach(o=>o.remove()); st.detail=null; render(true); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-fav],[data-close],[data-genre],[data-tl],[data-sv],[data-pick],[data-next],[data-quiz-reset],[data-save-prefs],[data-cards],[data-cards-one],[data-ai],[data-searchword]');
  if(!t) return;
  const d=t.dataset;
  if(d.fav!==undefined){ e.stopPropagation(); toggleFav(d.fav);
    const ov=document.querySelector('.overlay'); if(ov && st.detail===d.fav){ ov.remove(); const tmp=document.createElement('div'); tmp.innerHTML=detail(get(d.fav)); tmp.firstElementChild.style.animation='none'; $('#device').append(tmp.firstElementChild); }
    else render(true); return; }
  if(d.open) return openDetail(d.open);
  if(d.close!==undefined) return closeDetail();
  if(d.tab){ closeDetail(); st.tab=d.tab; store.set('tab',st.tab); render(); $('#screen').scrollTop=0; return; }
  if(d.genre){ st.genre = st.genre===d.genre?null:d.genre; render(true); return; }
  if(d.tl){ st.tl=d.tl; render(); return; }
  if(d.sv){ st.sv=d.sv; render(); return; }
  if(d.pick!==undefined){ const z=st.quiz; if(z.picked!==null) return; z.picked=+d.pick; if(z.picked===z.qs[z.i].ans) z.score++; render(true); return; }
  if(d.next!==undefined){ st.quiz.i++; st.quiz.picked=null; render(); return; }
  if(d.quizReset!==undefined){ st.quiz=newQuiz(); render(); return; }
  if(d.savePrefs!==undefined){
    st.prefs={daily:$('#daily').checked,time:$('#time').value,genres:[...document.querySelectorAll('input[name="g"]:checked')].map(x=>x.value)};
    store.set('prefs',st.prefs); toast('設定を保存しました'); return; }
  if(d.cards!==undefined) return openCards(WORDS.filter(w=>w.top).sort((a,b)=>a.top-b.top));
  if(d.cardsOne) return openCards([get(d.cardsOne)]);
  if(d.ai) return askAI(d.ai);
  if(d.searchword){ closeDetail(); st.tab='home'; st.q=d.searchword; render(); return; }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.row[role="button"]')){ e.preventDefault(); openDetail(e.target.dataset.open); }
  if(e.key==='Escape'){ if(document.querySelector('.cardwrap')) closeCards(); else if(document.querySelector('.overlay')) closeDetail(); }
});

/* intro points */
$('#points').innerHTML=[
  ['var(--primary)',I.bolt,'30秒で意味がわかる','カンタンに読めて、すぐ理解できるカード形式'],
  ['var(--good)',I.bulb,'なぜ流行っているかまでわかる','背景・理由・使われ方をやさしく解説'],
  ['var(--violet)',I.link,'情報源と更新日が見える','出典リンクつきで確かめられる'],
  ['var(--hot)',I.heart,'知らない言葉を責めない','わからないのは当たり前。気軽に調べてOK'],
  ['#5B5BD6',I.clock,'流行が終わった言葉も履歴で確認','見た言葉はいつでも見返せる'],
].map(([c,ic,b,s])=>`<li><span class="pi" style="background:${c}">${ic.replace('<svg','<svg width="18" height="18"')}</span><div><b>${b}</b><span>${s}</span></div></li>`).join('');

/* ---------- 毎朝の自動更新データを読み込む ---------- */
function applyTrends(d){
  if(!d || !Array.isArray(d.words) || !d.words.length) return;
  WORDS = d.words.filter(w=>w && w.id && w.w && w.one);
  PAST = Array.isArray(d.past) ? d.past.filter(w=>w && w.id && w.w && w.one) : [];
  if(d.updatedLabel) UPDATED = String(d.updatedLabel);
  reindex();
  if(!st.quiz || st.quiz.i===0 && st.quiz.picked===null) st.quiz=null;
  if(!document.querySelector('.overlay') && !document.activeElement?.matches('#q')) render(true);
}
(async()=>{
  try{
    const res = await fetch('data/trends.json?t='+Date.now(), {cache:'no-store'});
    if(res.ok) applyTrends(await res.json());
  }catch{}   // オフラインのときは前回のデータ（またはページ内のデータ）で表示
})();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

render();
</script>
